spring.application.name=smart_learning_application
server.port=8080

# H2 (local dev). Switch to Postgres later.
spring.datasource.url=jdbc:h2:mem:finchtalk_lms;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.security.jwt.issuer=finchtalk
app.security.jwt.secret=change_this_dev_secret_change_this_dev_secret
app.security.jwt.expirationSeconds=86400

